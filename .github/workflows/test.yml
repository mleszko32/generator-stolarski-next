name: Testy

# Lint (ESLint) + testy jednostkowe (Vitest) przy każdym pushu i pull requeście
# - błąd w obliczeniach formatek/okuć albo literówka w nazwie zmiennej
# (eslint.config.js: no-undef) wychodzi zanim zmiana trafi na produkcję (Vercel).
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
